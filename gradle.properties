# Project path contains non-ASCII characters ("Новая папка" in the path).
# This override suppresses the AGP path check. See http://b.android.com/95744
android.overridePathCheck=true

# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compile Kotlin inside the Gradle daemon instead of spawning a separate
# compiler process: on Windows the long classpath + non-ASCII project path
# makes CreateProcess fail with error 122 ("data area too small").
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true
